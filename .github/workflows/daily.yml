name: Truth Social Monitor

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"

  # Allows you to manually run the monitor from GitHub
  workflow_dispatch:

# Allow the workflow to save latest_post.json back to the repository
permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Run Truth Social monitor
      # --------------------------------------------------

      - name: Run monitor
        env:
          TRUTH_API_KEY: ${{ secrets.TRUTH_API_KEY }}
          TRUTH_API_URL: ${{ secrets.TRUTH_API_URL }}

          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python main.py

      # --------------------------------------------------
      # 5. Save latest_post.json
      # --------------------------------------------------

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest_post.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Truth Social monitor state"
            git push
          fi
